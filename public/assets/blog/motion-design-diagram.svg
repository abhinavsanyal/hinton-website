<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810"><rect width="1440" height="810" fill="#141414"/><text x="65" y="73" fill="#FF526E" font-size="22" font-weight="700" font-family="Arial,Helvetica,sans-serif">HINTON / FIELD NOTES</text><text x="65" y="154" fill="#F4F0E6" font-size="54" font-weight="700" font-family="Arial,Helvetica,sans-serif">The agent helps. The designer decides.</text><text x="65" y="204" fill="#BBB7AD" font-size="24" font-weight="400" font-family="Arial,Helvetica,sans-serif">A suggested workflow for repeatable motion and post-production deliverables.</text><rect x="65" y="295" width="240" height="270" rx="12" fill="#232323" stroke="#484848"/><text x="87" y="350" fill="#FF526E" font-size="24" font-weight="700" font-family="Arial,Helvetica,sans-serif">01</text><text x="87" y="421" fill="#F4F0E6" font-size="29" font-weight="700" font-family="Arial,Helvetica,sans-serif">BRIEF</text><text x="87" y="476" fill="#BBB7AD" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Define the rules</text><path d="M310 432h17m-7-7 7 7-7 7" fill="none" stroke="#F4CF49" stroke-width="2"/><rect x="332" y="295" width="240" height="270" rx="12" fill="#232323" stroke="#484848"/><text x="354" y="350" fill="#FF526E" font-size="24" font-weight="700" font-family="Arial,Helvetica,sans-serif">02</text><text x="354" y="421" fill="#F4F0E6" font-size="29" font-weight="700" font-family="Arial,Helvetica,sans-serif">SYSTEM</text><text x="354" y="476" fill="#BBB7AD" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Keep it editable</text><path d="M577 432h17m-7-7 7 7-7 7" fill="none" stroke="#F4CF49" stroke-width="2"/><rect x="599" y="295" width="240" height="270" rx="12" fill="#232323" stroke="#484848"/><text x="621" y="350" fill="#FF526E" font-size="24" font-weight="700" font-family="Arial,Helvetica,sans-serif">03</text><text x="621" y="421" fill="#F4F0E6" font-size="29" font-weight="700" font-family="Arial,Helvetica,sans-serif">PREVIEW</text><text x="621" y="476" fill="#BBB7AD" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Render examples</text><path d="M844 432h17m-7-7 7 7-7 7" fill="none" stroke="#F4CF49" stroke-width="2"/><rect x="866" y="295" width="240" height="270" rx="12" fill="#232323" stroke="#484848"/><text x="888" y="350" fill="#FF526E" font-size="24" font-weight="700" font-family="Arial,Helvetica,sans-serif">04</text><text x="888" y="421" fill="#F4F0E6" font-size="29" font-weight="700" font-family="Arial,Helvetica,sans-serif">REVIEW</text><text x="888" y="476" fill="#BBB7AD" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Judge the result</text><path d="M1111 432h17m-7-7 7 7-7 7" fill="none" stroke="#F4CF49" stroke-width="2"/><rect x="1133" y="295" width="240" height="270" rx="12" fill="#232323" stroke="#484848"/><text x="1155" y="350" fill="#FF526E" font-size="24" font-weight="700" font-family="Arial,Helvetica,sans-serif">05</text><text x="1155" y="421" fill="#F4F0E6" font-size="29" font-weight="700" font-family="Arial,Helvetica,sans-serif">DELIVER</text><text x="1155" y="476" fill="#BBB7AD" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Verify versions</text><path d="M1090 589v45H448v-45" fill="none" stroke="#FF526E" stroke-width="3"/><text x="555" y="626" fill="#F4F0E6" font-size="23" font-weight="400" font-family="Arial,Helvetica,sans-serif">Revise the system after review</text><path d="M65 705H1375" stroke="#484848"/><text x="65" y="750" fill="#BBB7AD" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Measure setup, review and correction time—not just how quickly the script runs.</text></svg>
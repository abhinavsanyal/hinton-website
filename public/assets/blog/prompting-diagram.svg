<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810"><rect width="1440" height="810" fill="#141414"/><text x="65" y="73" fill="#FF526E" font-size="22" font-weight="700" font-family="Arial,Helvetica,sans-serif">HINTON / FIELD NOTES</text><text x="65" y="154" fill="#F4F0E6" font-size="54" font-weight="700" font-family="Arial,Helvetica,sans-serif">Six decisions beat sixty adjectives.</text><text x="65" y="204" fill="#BBB7AD" font-size="24" font-weight="400" font-family="Arial,Helvetica,sans-serif">An original shot-brief framework for your next Seedance experiment.</text><rect x="65" y="265" width="420" height="170" rx="12" fill="#232323" stroke="#484848"/><text x="90" y="315" fill="#FF526E" font-size="23" font-weight="700" font-family="Arial,Helvetica,sans-serif">01</text><text x="90" y="359" fill="#F4F0E6" font-size="30" font-weight="700" font-family="Arial,Helvetica,sans-serif">SUBJECT</text><text x="90" y="402" fill="#BBB7AD" font-size="22" font-weight="400" font-family="Arial,Helvetica,sans-serif">What must stay recognisable?</text><rect x="510" y="265" width="420" height="170" rx="12" fill="#232323" stroke="#484848"/><text x="535" y="315" fill="#FF526E" font-size="23" font-weight="700" font-family="Arial,Helvetica,sans-serif">02</text><text x="535" y="359" fill="#F4F0E6" font-size="30" font-weight="700" font-family="Arial,Helvetica,sans-serif">ACTION</text><text x="535" y="402" fill="#BBB7AD" font-size="22" font-weight="400" font-family="Arial,Helvetica,sans-serif">What changes in the shot?</text><rect x="955" y="265" width="420" height="170" rx="12" fill="#232323" stroke="#484848"/><text x="980" y="315" fill="#FF526E" font-size="23" font-weight="700" font-family="Arial,Helvetica,sans-serif">03</text><text x="980" y="359" fill="#F4F0E6" font-size="30" font-weight="700" font-family="Arial,Helvetica,sans-serif">CAMERA</text><text x="980" y="402" fill="#BBB7AD" font-size="22" font-weight="400" font-family="Arial,Helvetica,sans-serif">Where does the viewer move?</text><rect x="65" y="459" width="420" height="170" rx="12" fill="#232323" stroke="#484848"/><text x="90" y="509" fill="#FF526E" font-size="23" font-weight="700" font-family="Arial,Helvetica,sans-serif">04</text><text x="90" y="553" fill="#F4F0E6" font-size="30" font-weight="700" font-family="Arial,Helvetica,sans-serif">SCENE</text><text x="90" y="596" fill="#BBB7AD" font-size="22" font-weight="400" font-family="Arial,Helvetica,sans-serif">What establishes the world?</text><rect x="510" y="459" width="420" height="170" rx="12" fill="#232323" stroke="#484848"/><text x="535" y="509" fill="#FF526E" font-size="23" font-weight="700" font-family="Arial,Helvetica,sans-serif">05</text><text x="535" y="553" fill="#F4F0E6" font-size="30" font-weight="700" font-family="Arial,Helvetica,sans-serif">TIMING</text><text x="535" y="596" fill="#BBB7AD" font-size="22" font-weight="400" font-family="Arial,Helvetica,sans-serif">When does the payoff happen?</text><rect x="955" y="459" width="420" height="170" rx="12" fill="#232323" stroke="#484848"/><text x="980" y="509" fill="#FF526E" font-size="23" font-weight="700" font-family="Arial,Helvetica,sans-serif">06</text><text x="980" y="553" fill="#F4F0E6" font-size="30" font-weight="700" font-family="Arial,Helvetica,sans-serif">SOUND</text><text x="980" y="596" fill="#BBB7AD" font-size="22" font-weight="400" font-family="Arial,Helvetica,sans-serif">What should we hear?</text><path d="M65 705H1375" stroke="#484848"/><text x="65" y="750" fill="#BBB7AD" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Change one variable per revision. Keep references, settings and outputs together.</text></svg>
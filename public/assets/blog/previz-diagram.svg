<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810"><rect width="1440" height="810" fill="#141414"/><text x="65" y="73" fill="#FF526E" font-size="22" font-weight="700" font-family="Arial,Helvetica,sans-serif">HINTON / FIELD NOTES</text><text x="65" y="154" fill="#F4F0E6" font-size="54" font-weight="700" font-family="Arial,Helvetica,sans-serif">Plan the move. Then make the image.</text><text x="65" y="204" fill="#BBB7AD" font-size="24" font-weight="400" font-family="Arial,Helvetica,sans-serif">An editable shot plan gives the generated version something concrete to follow.</text><rect x="65" y="290" width="310" height="290" rx="12" fill="#232323" stroke="#484848"/><text x="90" y="342" fill="#FF526E" font-size="24" font-weight="700" font-family="Arial,Helvetica,sans-serif">01 / BRIEF</text><text x="90" y="412" fill="#F4F0E6" font-size="25" font-weight="400" font-family="Arial,Helvetica,sans-serif">Name the action.</text><text x="90" y="456" fill="#F4F0E6" font-size="25" font-weight="400" font-family="Arial,Helvetica,sans-serif">Choose the reveal.</text><text x="90" y="540" fill="#F4CF49" font-size="44" font-weight="400" font-family="Arial,Helvetica,sans-serif">→</text><rect x="399" y="290" width="310" height="290" rx="12" fill="#232323" stroke="#484848"/><text x="424" y="342" fill="#FF526E" font-size="24" font-weight="700" font-family="Arial,Helvetica,sans-serif">02 / BLOCK</text><text x="424" y="412" fill="#F4F0E6" font-size="25" font-weight="400" font-family="Arial,Helvetica,sans-serif">Build the scene.</text><text x="424" y="456" fill="#F4F0E6" font-size="25" font-weight="400" font-family="Arial,Helvetica,sans-serif">Place the camera.</text><text x="424" y="540" fill="#F4CF49" font-size="44" font-weight="400" font-family="Arial,Helvetica,sans-serif">→</text><rect x="733" y="290" width="310" height="290" rx="12" fill="#232323" stroke="#484848"/><text x="758" y="342" fill="#FF526E" font-size="24" font-weight="700" font-family="Arial,Helvetica,sans-serif">03 / RENDER</text><text x="758" y="412" fill="#F4F0E6" font-size="25" font-weight="400" font-family="Arial,Helvetica,sans-serif">Export clay video.</text><text x="758" y="456" fill="#F4F0E6" font-size="25" font-weight="400" font-family="Arial,Helvetica,sans-serif">Approve the timing.</text><text x="758" y="540" fill="#F4CF49" font-size="44" font-weight="400" font-family="Arial,Helvetica,sans-serif">→</text><rect x="1067" y="290" width="310" height="290" rx="12" fill="#232323" stroke="#484848"/><text x="1092" y="342" fill="#FF526E" font-size="24" font-weight="700" font-family="Arial,Helvetica,sans-serif">04 / GENERATE</text><text x="1092" y="412" fill="#F4F0E6" font-size="25" font-weight="400" font-family="Arial,Helvetica,sans-serif">Assign references.</text><text x="1092" y="456" fill="#F4F0E6" font-size="25" font-weight="400" font-family="Arial,Helvetica,sans-serif">Compare landmarks.</text><text x="1092" y="540" fill="#F4CF49" font-size="44" font-weight="400" font-family="Arial,Helvetica,sans-serif">↺</text><path d="M65 705H1375" stroke="#484848"/><text x="65" y="750" fill="#BBB7AD" font-size="21" font-weight="400" font-family="Arial,Helvetica,sans-serif">Reference-led workflow • Compare framing, timing and screen direction; exact transfer is not guaranteed.</text></svg>
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hinton Studios — Dream in 4K (reel composition)</title>
<style>
  @font-face { font-family: "Anton"; src: url(assets/fonts/Anton-Regular.ttf); }
  @font-face { font-family: "Archivo Black"; src: url(assets/fonts/ArchivoBlack-Regular.ttf); }
  @font-face { font-family: "DM Serif"; src: url(assets/fonts/DMSerifDisplay-Regular.ttf); }
  @font-face { font-family: "DM Serif"; font-style: italic; src: url(assets/fonts/DMSerifDisplay-Italic.ttf); }
  @font-face { font-family: "Playfair"; font-weight: 400 900; src: url(assets/fonts/Playfair.ttf); }
  @font-face { font-family: "Playfair"; font-style: italic; font-weight: 400 900; src: url(assets/fonts/Playfair-Italic.ttf); }
  @font-face { font-family: "Elite"; src: url(assets/fonts/SpecialElite-Regular.ttf); }
  @font-face { font-family: "Oswald"; font-weight: 200 700; src: url(assets/fonts/Oswald.ttf); }
  @font-face { font-family: "Roboto"; font-weight: 100 900; src: url(assets/fonts/Roboto.ttf); }
  @font-face { font-family: "Roboto Mono"; font-weight: 100 700; src: url(assets/fonts/RobotoMono.ttf); }
  @font-face { font-family: "Indic"; src: url(assets/fonts/NotoSansBengali-Bold.ttf); unicode-range: U+0980-09FF; }
  @font-face { font-family: "Indic"; src: url(assets/fonts/NotoSansTamil-Bold.ttf); unicode-range: U+0B80-0BFF; }
  @font-face { font-family: "Indic"; src: url(assets/fonts/NotoSansTelugu-Bold.ttf); unicode-range: U+0C00-0C7F; }
  @font-face { font-family: "Indic"; src: url(assets/fonts/NotoSansKannada-Bold.ttf); unicode-range: U+0C80-0CFF; }
  @font-face { font-family: "Indic"; src: url(assets/fonts/NotoSansMalayalam-Bold.ttf); unicode-range: U+0D00-0D7F; }
  @font-face { font-family: "Indic"; src: url(assets/fonts/NotoSansDevanagari-Bold.ttf); unicode-range: U+0900-097F, U+200C-200D; }

  :root {
    --ink: #0b0a09;
    --char: #151311;
    --paper: #efe7d6;
    --paper-2: #e2d7bf;
    --cream: #f6f0e2;
    --red: #b3122b;
    --red-hi: #e11d48;
    --red-deep: #4a0710;
    --gold: #f4b41a;
    --marigold: #ff8a00;
    --cold: #9fb4c8;
  }
  html, body { margin: 0; padding: 0; background: #000; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: var(--ink); }
  #world { position: absolute; inset: 0; transform-origin: 540px 960px; }
  .scene { position: absolute; inset: 0; display: none; overflow: hidden; }
  #world { --grade: none; }
  .scene img { filter: var(--grade); }
  .abs { position: absolute; }
  .fill { position: absolute; inset: 0; }
  .cover { width: 100%; height: 100%; object-fit: cover; display: block; }
  .print { position: absolute; background: var(--cream); padding: 16px 16px 16px 16px; box-shadow: 0 30px 60px rgba(0,0,0,.55), 0 6px 14px rgba(0,0,0,.4); }
  .print .inner { position: relative; width: 100%; height: 100%; overflow: hidden; background: #222; }
  .print .inner img { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; transform-origin: 50% 50%; }
  .label { position: absolute; font-family: "Roboto Mono"; font-weight: 600; font-size: 26px; letter-spacing: .08em; color: #fff; background: #0b0a09; padding: 10px 16px 9px; white-space: nowrap; text-transform: uppercase; }
  .label.paper { background: var(--paper); color: var(--ink); }
  .label.red { background: var(--red-hi); color: #fff; }
  .serif { font-family: "DM Serif"; }
  .anton { font-family: "Anton"; text-transform: uppercase; letter-spacing: .01em; }
  .mono { font-family: "Roboto Mono"; }
  .elite { font-family: "Elite"; }
  .center-x { left: 0; right: 0; text-align: center; }
  .clip { position: absolute; background-color: var(--paper); color: var(--ink); padding: 26px 30px 30px; box-shadow: 0 18px 40px rgba(0,0,0,.45); }
  .clip .mast { font-family: "Playfair"; font-weight: 900; font-size: 22px; letter-spacing: .28em; text-transform: uppercase; border-bottom: 3px double var(--ink); padding-bottom: 8px; margin-bottom: 12px; display: flex; justify-content: space-between; }
  .clip .head { font-family: "Playfair"; font-weight: 900; font-size: 54px; line-height: .98; text-transform: uppercase; letter-spacing: -.01em; }
  .clip .sub { font-family: "Elite"; font-size: 24px; margin-top: 12px; }
  .clip.compact { padding: 16px 24px 18px; }
  .clip.compact .mast { font-size: 17px; padding-bottom: 5px; margin-bottom: 8px; }
  .clip.compact .head { font-size: 40px; line-height: 1; }
  .clip.compact .sub { font-size: 20px; margin-top: 6px; }
  .clip .cols { margin-top: 14px; height: 110px; background: repeating-linear-gradient(180deg, rgba(20,18,15,.55) 0 5px, transparent 5px 14px); -webkit-mask: linear-gradient(90deg, #000 0 31%, transparent 31% 34%, #000 34% 65%, transparent 65% 68%, #000 68%); mask: linear-gradient(90deg, #000 0 31%, transparent 31% 34%, #000 34% 65%, transparent 65% 68%, #000 68%); }
  svg.ov { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; overflow: visible; pointer-events: none; }
  #fx { mix-blend-mode: overlay; }
  canvas.full { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  #hud { position: absolute; inset: 0; pointer-events: none; }
  #caption { position: absolute; left: 70px; right: 70px; top: 1446px; text-align: center; font-family: "Roboto"; font-weight: 500; font-size: 38px; line-height: 1.3; color: #fff; }
  #caption span { display: inline-block; background: rgba(8,8,8,.72); padding: 8px 22px 9px; border-radius: 6px; }
  #caption b { font-weight: 800; }
</style>
</head>
<body>
<div id="stage">
  <div id="world"></div>
  <canvas id="fx" class="full" width="540" height="960"></canvas>
  <div id="vignette" class="fill"></div>
  <div id="hud"></div>
  <div id="caption"></div>
  <div id="flash" class="fill" style="background:#fff;opacity:0"></div>
  <div id="fade" class="fill" style="background:#000;opacity:0"></div>
</div>
<script src="vendor/gsap.min.js"></script>
<script src="assets/data/manifest.js"></script>
<script src="lib.js"></script>
<script src="scenes.js"></script>
<script src="main.js"></script>
</body>
</html>
